<header class="bg-white shadow p-3">
  <div class="max-w-6xl mx-auto flex justify-between items-center">
    @if (isHome()) {
      <a routerLink="/" class="text-xl font-bold">Sistema de Votação</a>
    } @else {
      <a routerLink="/" class="border-2 py-1 px-3 rounded flex items-center gap-1 text-gray-600 hover:text-gray-900">
        <span aria-hidden="true">←</span>
        Voltar
      </a>
    }

    <nav class="flex gap-4 items-center">
      @if (auth.isAuthenticated()) {
        <div class="relative">
          <button
            type="button"
            (click)="toggleMenu()"
            class="flex items-center gap-2 bg-gray-100 rounded-full py-1.5 pl-1.5 pr-3.5 hover:bg-gray-200 cursor-pointer"
          >
            <span
              class="flex items-center justify-center w-7 h-7 rounded-full bg-violet-200 text-violet-800 font-semibold text-sm"
            >
              {{ initial() }}
            </span>
            <span class="hidden sm:inline text-sm text-gray-700">{{ firstName() }}</span>
            <svg viewBox="0 0 20 20" fill="currentColor" class="w-4 h-4 text-gray-500">
              <path
                fill-rule="evenodd"
                d="M5.23 7.21a.75.75 0 011.06.02L10 10.94l3.71-3.71a.75.75 0 111.06 1.06l-4.24 4.25a.75.75 0 01-1.06 0L5.21 8.29a.75.75 0 01.02-1.08z"
                clip-rule="evenodd"
              />
            </svg>
          </button>

          @if (isMenuOpen()) {
            <div class="absolute right-0 mt-2 w-40 bg-white border border-gray-200 rounded-lg shadow-lg py-1 z-10">
              <button
                type="button"
                (click)="logout()"
                class="w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 cursor-pointer"
              >
                Sair
              </button>
            </div>
          }
        </div>
        <a
          routerLink="/polls/new"
          class="bg-violet-500 text-white py-1 px-2 rounded hover:bg-violet-600 hover:shadow-md"
        >
          Nova Enquete
        </a>
      } @else {
        <a routerLink="/login" class="text-gray-600 hover:text-gray-900">Entrar</a>
      }
    </nav>
  </div>
</header>
