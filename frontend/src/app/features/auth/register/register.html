<div class="max-w-sm mx-auto flex flex-col gap-6">
  <h1 class="text-2xl font-bold">Criar Conta</h1>

  @if (errors().length > 0) {
    <div class="bg-red-100 text-red-700 p-4 rounded">
      <ul class="list-disc list-inside">
        @for (error of errors(); track error) {
          <li>{{ error }}</li>
        }
      </ul>
    </div>
  }

  <form (ngSubmit)="submit()" class="flex flex-col gap-4">
    <div>
      <label class="block font-medium mb-1" for="name">Nome</label>
      <input
        type="text"
        id="name"
        name="name"
        [ngModel]="name()"
        (ngModelChange)="name.set($event)"
        class="w-full border rounded px-3 py-2"
        required
      />
    </div>

    <div>
      <label class="block font-medium mb-1" for="email">E-mail</label>
      <input
        type="email"
        id="email"
        name="email"
        [ngModel]="email()"
        (ngModelChange)="email.set($event)"
        class="w-full border rounded px-3 py-2"
        required
      />
    </div>

    <div>
      <label class="block font-medium mb-1" for="password">Senha</label>
      <input
        type="password"
        id="password"
        name="password"
        [ngModel]="password()"
        (ngModelChange)="password.set($event)"
        class="w-full border rounded px-3 py-2"
        required
      />
    </div>

    <div>
      <label class="block font-medium mb-1" for="password_confirmation">Confirmar Senha</label>
      <input
        type="password"
        id="password_confirmation"
        name="password_confirmation"
        [ngModel]="passwordConfirmation()"
        (ngModelChange)="passwordConfirmation.set($event)"
        class="w-full border rounded px-3 py-2"
        required
      />
    </div>

    <button type="submit" class="bg-violet-600 text-white px-4 py-2 rounded hover:bg-violet-900 transition cursor-pointer">
      Criar Conta
    </button>
  </form>

  <p class="text-sm text-gray-600">
    Já tem uma conta?
    <a routerLink="/login" class="text-violet-600 hover:underline">Entrar</a>
  </p>
</div>
